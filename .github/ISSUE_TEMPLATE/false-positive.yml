name: False positive or missed problem
description: Spectator reported something wrong, or missed something it should catch
labels: [accuracy]
body:
  - type: textarea
    id: snippet
    attributes:
      label: Smallest code that reproduces it
      render: text
    validations:
      required: true
  - type: textarea
    id: said
    attributes:
      label: What Spectator said
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should have said
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Spectator version and language / framework
      placeholder: 0.12.2 · Python 3.12 · FastAPI
